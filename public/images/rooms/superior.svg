<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d7b6"/>
      <stop offset="1" stop-color="#c9b083"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1067" fill="url(#wallS)"/>
  <!-- window with park view -->
  <rect x="100" y="150" width="520" height="450" fill="#8fa58a"/>
  <rect x="100" y="150" width="520" height="450" fill="none" stroke="#4a371a" stroke-width="12"/>
  <line x1="360" y1="150" x2="360" y2="600" stroke="#4a371a" stroke-width="6"/>
  <line x1="100" y1="375" x2="620" y2="375" stroke="#4a371a" stroke-width="6"/>
  <!-- trees in window -->
  <circle cx="230" cy="400" r="70" fill="#6b7a4f"/>
  <circle cx="490" cy="420" r="90" fill="#6b7a4f"/>
  <!-- floor -->
  <rect y="780" width="1600" height="287" fill="#8c6a36" opacity="0.4"/>
  <!-- armchair -->
  <rect x="900" y="620" width="400" height="220" rx="20" fill="#6b7a4f"/>
  <rect x="900" y="600" width="400" height="40" rx="12" fill="#4a5538"/>
  <rect x="900" y="820" width="40" height="60" fill="#4a371a"/>
  <rect x="1260" y="820" width="40" height="60" fill="#4a371a"/>
  <!-- side table -->
  <rect x="760" y="740" width="100" height="10" fill="#4a371a"/>
  <rect x="800" y="750" width="20" height="120" fill="#4a371a"/>
  <circle cx="810" cy="720" r="18" fill="#b8894b"/>
  <!-- bed edge -->
  <rect x="100" y="870" width="1400" height="40" fill="#f6f1e7"/>
</svg>
