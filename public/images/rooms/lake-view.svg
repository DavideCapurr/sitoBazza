<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d6a3"/>
      <stop offset="0.5" stop-color="#e8b988"/>
      <stop offset="1" stop-color="#b8894b"/>
    </linearGradient>
    <linearGradient id="lakeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a62"/>
      <stop offset="1" stop-color="#2f3f48"/>
    </linearGradient>
  </defs>
  <!-- interior walls -->
  <rect width="1600" height="1067" fill="#f6f1e7"/>
  <!-- large window -->
  <rect x="150" y="120" width="1300" height="620" fill="url(#skyL)"/>
  <rect x="150" y="450" width="1300" height="290" fill="url(#lakeL)"/>
  <!-- sun reflection -->
  <circle cx="1150" cy="350" r="55" fill="#fff3cf"/>
  <ellipse cx="1150" cy="540" rx="30" ry="80" fill="#f2c77a" opacity="0.7"/>
  <!-- distant mountains -->
  <path d="M150,450 L350,320 L550,380 L800,270 L1100,380 L1450,310 L1450,450 Z" fill="#4a5538" opacity="0.7"/>
  <!-- window frame -->
  <rect x="150" y="120" width="1300" height="620" fill="none" stroke="#4a371a" stroke-width="14"/>
  <line x1="800" y1="120" x2="800" y2="740" stroke="#4a371a" stroke-width="8"/>
  <!-- curtain side -->
  <rect x="100" y="100" width="60" height="700" fill="#d9c9a7" opacity="0.9"/>
  <rect x="1440" y="100" width="60" height="700" fill="#d9c9a7" opacity="0.9"/>
  <!-- balcony/terrace bar -->
  <rect x="150" y="740" width="1300" height="10" fill="#b8894b"/>
  <!-- bed foot -->
  <rect x="0" y="870" width="1600" height="50" fill="#f6f1e7"/>
  <rect x="0" y="920" width="1600" height="147" fill="#c9b083" opacity="0.6"/>
</svg>
